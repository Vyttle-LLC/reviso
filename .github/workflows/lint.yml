name: lint
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8 # v16
        with:
          globs: '**/*.md'
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Mail links are excluded by default in lychee v2 — the spec's
          # --exclude-mail was removed upstream. The longer timeout is for
          # hosts that are slow to answer a runner; a link check that fails
          # on someone else's bad afternoon teaches people to ignore it.
          args: --no-progress --timeout 30 --max-retries 5 --retry-wait-time 3 '**/*.md'
