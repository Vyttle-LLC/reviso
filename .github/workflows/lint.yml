name: lint
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8 # v16
        with:
          globs: '**/*.md'
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Mail links are excluded by default in lychee v2 — the spec's
          # --exclude-mail was removed upstream. Retries are kept low on
          # purpose: a link that is going to fail should fail in seconds, not
          # after five minutes of hopeful waiting. Hosts that can't cope with
          # a runner belong in .lycheeignore instead.
          args: --no-progress --timeout 20 --max-retries 2 '**/*.md'
