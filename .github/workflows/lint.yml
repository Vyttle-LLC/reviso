name: lint
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: '**/*.md'
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # --offline resolves local links on disk and never touches the
          # network. Those are the links our own edits break, so they belong
          # in a required check. External links rot slowly and fail for
          # reasons we don't control — they're on a schedule instead, in
          # link-check.yml. A required check that goes red on someone else's
          # WAF gets muted, and a muted check catches nothing at all.
          args: --no-progress --offline '**/*.md'
