name: link-check
on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour, so we're not in the crowd.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every link, external included
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --timeout 20 --max-retries 2 '**/*.md'
          # Never fails the job. Link rot is a thing to go fix, not a thing to
          # block on — nobody's PR broke it.
          fail: false
          output: lychee/out.md
      - name: Report rot
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --label link-rot --state open --limit 1 \
                   --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file lychee/out.md
          else
            gh issue create --title "Link check: dead links found" \
              --label link-rot --body-file lychee/out.md
          fi
