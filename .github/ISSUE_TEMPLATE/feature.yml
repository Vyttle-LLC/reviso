name: Feature request
description: Something Reviso should do that it doesn't.
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Lead with the problem, not the solution. We can usually find a better
        design than either of us would reach alone, but only if we understand
        what you were actually trying to do.
  - type: textarea
    id: problem
    attributes:
      label: The problem you're hitting
      description: What goes wrong today, and how often.
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: What you'd want
      description: Rough is fine. A sketch beats a spec.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: >
        The workaround, the other tool, or the manual step. This tells us how
        much the gap actually costs.
    validations:
      required: true
